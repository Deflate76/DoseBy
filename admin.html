<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doseby Admin - 데이터 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .admin-card { border-left: 4px solid #ef4444; } /* 관리자 전용 강조 */
        .public-card { border-left: 4px solid #3b82f6; } /* 일반 데이터 강조 */
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg text-center">
            <h1 class="text-2xl font-bold mb-6">Doseby Admin</h1>
            <button id="btn-login" class="flex items-center justify-center w-full px-4 py-3 text-white bg-black rounded-lg hover:bg-gray-800 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5 mr-3">
                관리자 구글 로그인
            </button>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Doseby 시스템 관리</h1>
                <p id="user-display" class="text-gray-500 mt-1"></p>
            </div>
            <button id="btn-logout" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">로그아웃</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <section class="public-card bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center mb-4">
                    <span class="p-2 bg-blue-100 text-blue-600 rounded-full mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </span>
                    <h2 class="text-xl font-bold">일반 데이터 관리 (Public)</h2>
                </div>
                <p class="text-sm text-gray-500 mb-6">의약품 DB, 건강기능식품 용량 등 모든 사용자가 조회 가능한 정보입니다.</p>
                
                <div class="space-y-3">
                    <button onclick="saveData('public_data', 'medicine_list')" class="w-full py-2 text-blue-600 border border-blue-600 rounded hover:bg-blue-50 transition">의약품 정보 업데이트</button>
                    <button onclick="readData('public_data')" class="w-full py-2 text-gray-600 border border-gray-300 rounded hover:bg-gray-50 transition">현재 공개 데이터 확인</button>
                </div>
            </section>

            <section class="admin-card bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center mb-4">
                    <span class="p-2 bg-red-100 text-red-600 rounded-full mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <h2 class="text-xl font-bold text-red-600">보안 데이터 관리 (Admin Only)</h2>
                </div>
                <p class="text-sm text-gray-500 mb-6">시스템 설정, 관리자 로그, 민감한 구성 정보 등 외부 노출이 금지된 영역입니다.</p>
                
                <div class="space-y-3">
                    <button onclick="saveData('admin_data', 'app_settings')" class="w-full py-2 text-white bg-red-500 rounded hover:bg-red-600 transition shadow-sm">시스템 환경설정 변경</button>
                    <button onclick="readData('admin_data')" class="w-full py-2 text-red-500 border border-red-200 rounded hover:bg-red-50 transition">보안 로그 조회</button>
                </div>
            </section>

        </div>

        <div class="mt-10 p-4 bg-gray-900 rounded-lg text-green-400 font-mono text-sm">
            <p>> System Console:</p>
            <div id="console-log" class="mt-2 h-32 overflow-y-auto">대기 중...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZZOOEgvGG1b7LR0HgS3DcS0N9v8dGXCc",
            authDomain: "doseby-585d7.firebaseapp.com",
            projectId: "doseby-585d7",
            storageBucket: "doseby-585d7.firebasestorage.app",
            messagingSenderId: "96877152271",
            appId: "1:96877152271:web:aa3af1ce766897db25fb7a",
            measurementId: "G-0LHJ4D0ERN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const adminEmail = 'your-admin@gmail.com'; // 규칙에 설정한 관리자 이메일

        // UI 요소
        const loginSection = document.getElementById('login-section');
        const adminDashboard = document.getElementById('admin-dashboard');
        const consoleLog = document.getElementById('console-log');
        const userDisplay = document.getElementById('user-display');

        // 커스텀 로그 함수
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            consoleLog.innerHTML += `<div>[${time}] ${msg}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        // 로그인 핸들러
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert(`로그인 실패: ${error.code}`);
            }
        });

        // 로그아웃 핸들러
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // 상태 변화 감지
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === adminEmail) {
                loginSection.classList.add('hidden');
                adminDashboard.classList.remove('hidden');
                userDisplay.innerText = `${user.displayName} 관리자 로그인 중`;
                log("관리자 인증 성공. 데이터 접근 권한이 활성화되었습니다.");
            } else {
                if (user) {
                    alert("관리자 권한이 없는 계정입니다.");
                    signOut(auth);
                }
                loginSection.classList.remove('hidden');
                adminDashboard.classList.add('hidden');
            }
        });

        // Firestore 데이터 저장 함수 (전역 노출)
        window.saveData = async (collection, docId) => {
            try {
                const targetRef = doc(db, collection, docId);
                await setDoc(targetRef, { 
                    lastUpdated: new Date().toISOString(),
                    updatedBy: auth.currentUser.email,
                    status: "active"
                }, { merge: true });
                log(`[성공] ${collection}/${docId} 데이터 업데이트 완료.`);
            } catch (e) {
                log(`[오류] 권한이 없거나 저장에 실패했습니다: ${e.message}`);
            }
        };

        // Firestore 데이터 읽기 함수 (전역 노출)
        window.readData = async (collection) => {
            log(`[조회] ${collection} 경로에서 데이터를 불러오는 중...`);
            // 예시로 'test' 문서를 읽음
            try {
                const docSnap = await getDoc(doc(db, collection, 'test_doc'));
                if (docSnap.exists()) {
                    log(`데이터 발견: ${JSON.stringify(docSnap.data())}`);
                } else {
                    log(`${collection} 경로에 읽을 수 있는 'test_doc'이 없습니다.`);
                }
            } catch (e) {
                log(`[조회 실패] 보안 규칙에 의해 차단되었거나 오류 발생: ${e.message}`);
            }
        };
    </script>
</body>
</html>
