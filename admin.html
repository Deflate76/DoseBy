<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doseby Admin - 통합 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .admin-card { border-left: 4px solid #ef4444; }
        .public-card { border-left: 4px solid #3b82f6; }
        #console-log::-webkit-scrollbar { width: 8px; }
        #console-log::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- 로그인 섹션 -->
    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md p-10 bg-white rounded-2xl shadow-xl text-center">
            <div class="inline-block p-4 mb-4 bg-blue-50 rounded-full">
                <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.673.337a4 4 0 01-1.909.494H4.8c-.18 0-.353.039-.508.107m7.477-9.277l4.474 8.948m-8.948 0L7.16 5.83M7 20h10"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Doseby Admin</h1>
            <p class="text-gray-500 mb-8">의약품 및 건강기능식품 데이터 관리</p>
            <button id="btn-login" class="flex items-center justify-center w-full px-4 py-3 text-white bg-gray-900 rounded-xl hover:bg-black transition-all transform hover:scale-[1.02]">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5 mr-3">
                관리자 계정으로 로그인
            </button>
        </div>
    </div>

    <!-- 관리자 대시보드 -->
    <div id="admin-dashboard" class="hidden container mx-auto px-4 py-10">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">Doseby Control Center</h1>
                <p id="user-display" class="text-blue-600 font-medium mt-1"></p>
            </div>
            <button id="btn-logout" class="px-6 py-2 bg-white text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition shadow-sm">로그아웃</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            
            <!-- 공공 데이터 (약품 용량 관리) 섹션 -->
            <section class="public-card bg-white p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                <div class="flex items-center mb-6">
                    <span class="p-3 bg-blue-50 text-blue-600 rounded-xl mr-4">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    </span>
                    <h2 class="text-xl font-bold text-gray-800">의약품 용량 관리</h2>
                </div>
                
                <!-- 검색창 -->
                <div class="flex gap-2 mb-4">
                    <select id="search-type" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white text-gray-700">
                        <option value="ppmaincode">PP Main Code</option>
                        <option value="ingredient">Ingredient</option>
                    </select>
                    <input type="text" id="search-keyword" placeholder="검색어 입력..." class="border border-gray-300 rounded-lg px-3 py-2 flex-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-gray-700">
                    <button id="btn-search-drug" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium text-sm whitespace-nowrap">검색</button>
                </div>

                <!-- 검색 결과 리스트 -->
                <div id="search-results-container" class="mb-4 hidden max-h-40 overflow-y-auto border border-gray-200 rounded-lg bg-gray-50 p-2">
                    <ul id="search-results-list" class="space-y-2"></ul>
                </div>

                <!-- 용량 상세 입력 및 조회 폼 -->
                <div id="dose-detail-container" class="hidden border-t border-gray-200 pt-5 mt-2">
                    <h3 class="text-sm font-bold text-gray-800 mb-2">
                        용량(Dose) 정보 리스트 <span id="selected-drug-label" class="text-blue-600 ml-1"></span>
                    </h3>

                    <!-- 현재 저장된 용량 리스트 표시 영역 -->
                    <div id="dose-list-display" class="mb-5 space-y-2 max-h-40 overflow-y-auto bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <!-- JS에서 렌더링 -->
                    </div>

                    <h4 class="text-xs font-bold text-gray-500 mb-2">새 용량 추가</h4>
                    <!-- 입력 폼 -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                        <div class="col-span-1">
                            <label class="block text-xs text-gray-500 mb-1">Dose (double)</label>
                            <input type="number" step="0.01" id="input-Dose" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-xs text-gray-500 mb-1">DoseUnit (string)</label>
                            <input type="text" id="input-DoseUnit" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs text-gray-500 mb-1">InCaseOf (string)</label>
                            <input type="text" id="input-InCaseOf" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>

                        <div class="col-span-1">
                            <label class="block text-xs text-gray-500 mb-1">MinAge (int)</label>
                            <input type="number" id="input-MinAge" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-xs text-gray-500 mb-1">MaxAge (int)</label>
                            <input type="number" id="input-MaxAge" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-xs text-gray-500 mb-1">MinBWT (double)</label>
                            <input type="number" step="0.01" id="input-MinBWT" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-xs text-gray-500 mb-1">MaxBWT (double)</label>
                            <input type="number" step="0.01" id="input-MaxBWT" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                        </div>
                    </div>
                    <button id="btn-save-dose" class="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium text-sm">리스트에 추가 및 저장</button>
                </div>
            </section>

            <!-- 보안 설정 섹션 -->
            <section class="admin-card bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center mb-6">
                    <span class="p-3 bg-red-50 text-red-600 rounded-xl mr-4">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <h2 class="text-xl font-bold text-gray-800">시스템 보안 설정</h2>
                </div>
                <p class="text-gray-500 mb-8 text-sm leading-relaxed">관리자 전용 설정 및 시스템 로그. <strong>특정 관리자 이메일</strong>만 접근 가능합니다.</p>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="handleFireStore('save', 'admin_data', 'system_config')" class="w-full py-3 px-4 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-medium">환경설정 동기화</button>
                    <button onclick="handleFireStore('read', 'admin_data', 'system_config')" class="w-full py-3 px-4 bg-white text-red-500 border border-red-200 rounded-lg hover:bg-red-50 transition font-medium">보안 로그 및 설정 조회</button>
                </div>
            </section>
        </div>

        <!-- 시스템 콘솔 -->
        <div class="mt-10 bg-gray-900 rounded-2xl overflow-hidden shadow-2xl">
            <div class="px-5 py-3 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">System Live Console</span>
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
            </div>
            <div id="console-log" class="p-6 h-48 overflow-y-auto font-mono text-sm leading-relaxed">
                <div class="text-gray-500">// 시스템 통신 대기 중...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        // 검색(query, where, getDocs) 및 배열 추가(arrayUnion) 함수 추가
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp, collection, query, where, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZZOOEgvGG1b7LR0HgS3DcS0N9v8dGXCc",
            authDomain: "doseby-585d7.firebaseapp.com",
            projectId: "doseby-585d7",
            storageBucket: "doseby-585d7.firebasestorage.app",
            messagingSenderId: "96877152271",
            appId: "1:96877152271:web:aa3af1ce766897db25fb7a",
            measurementId: "G-0LHJ4D0ERN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('login-section');
        const adminDashboard = document.getElementById('admin-dashboard');
        const userDisplay = document.getElementById('user-display');
        const consoleLog = document.getElementById('console-log');

        let currentSelectedDrugId = null; // 선택된 약품 문서 ID 저장 변수

        // 로그 출력 함수
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = 'text-green-400';
            if (type === 'error') color = 'text-red-400';
            if (type === 'warn') color = 'text-yellow-400';

            const entry = document.createElement('div');
            entry.className = `mb-1 ${color}`;
            entry.innerHTML = `<span class="text-gray-600">[${time}]</span> ${msg}`;
            consoleLog.appendChild(entry);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        // 인증 관리
        document.getElementById('btn-login').addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { log(`로그인 실패: ${error.message}`, 'error'); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => log("로그아웃 되었습니다."));
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminDashboard.classList.remove('hidden');
                userDisplay.innerText = `● 접속 계정: ${user.email} (${user.displayName})`;
                log(`사용자 인증됨: ${user.email}`);
            } else {
                loginSection.classList.remove('hidden');
                adminDashboard.classList.add('hidden');
                consoleLog.innerHTML = '<div class="text-gray-500">// 시스템 통신 대기 중...</div>';
            }
        });

        /* =========================================
           1. 약품 검색 기능 (DrugMaster Collection)
        ========================================= */
        document.getElementById('btn-search-drug').addEventListener('click', async () => {
            if (!auth.currentUser) return alert("로그인이 필요합니다.");

            const searchType = document.getElementById('search-type').value;
            const keyword = document.getElementById('search-keyword').value.trim();

            if (!keyword) return alert("검색어를 입력하세요.");
            log(`DrugMaster 검색 시작: [${searchType} == ${keyword}]`);

            try {
                // DrugMaster를 컬렉션으로 간주하여 검색합니다. 
                // (만약 admin_data 내의 하위 컬렉션이라면 collection(db, "admin_data", "DrugMaster", "Items") 형태로 수정 필요)
                const q = query(collection(db, "DrugMaster"), where(searchType, "==", keyword));
                const querySnapshot = await getDocs(q);

                const resultsList = document.getElementById('search-results-list');
                resultsList.innerHTML = '';
                
                if (querySnapshot.empty) {
                    resultsList.innerHTML = '<li class="text-sm text-gray-500 p-3 text-center">일치하는 약품 정보가 없습니다.</li>';
                    log(`결과 없음: 일치하는 데이터가 존재하지 않습니다.`, 'warn');
                } else {
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const li = document.createElement('li');
                        li.className = "flex justify-between items-center p-3 bg-white border rounded-lg shadow-sm";
                        li.innerHTML = `
                            <div>
                                <p class="text-sm font-bold text-gray-800">${data.ppmaincode || 'N/A'}</p>
                                <p class="text-xs text-gray-500">${data.ingredient || 'N/A'}</p>
                            </div>
                            <button class="px-4 py-1.5 bg-blue-100 text-blue-700 rounded-md text-xs font-bold hover:bg-blue-200 transition" 
                                onclick="window.selectDrug('${docSnap.id}', '${data.ppmaincode || data.ingredient}')">
                                선택
                            </button>
                        `;
                        resultsList.appendChild(li);
                    });
                    log(`검색 완료: ${querySnapshot.size}건의 약품 발견.`);
                }
                document.getElementById('search-results-container').classList.remove('hidden');
                document.getElementById('dose-detail-container').classList.add('hidden'); // 기존 열려있던 창 숨김

            } catch (error) {
                log(`검색 권한 오류 또는 실패: ${error.message}`, 'error');
                console.error(error);
            }
        });

        /* =========================================
           2. 약품 선택 및 용량 데이터 로드
        ========================================= */
        window.selectDrug = async (drugId, label) => {
            currentSelectedDrugId = drugId;
            document.getElementById('selected-drug-label').innerText = `(${label})`;
            document.getElementById('dose-detail-container').classList.remove('hidden');
            await loadDoseList(drugId);
        };

        // 특정 약품의 doselist 문서 조회
        async function loadDoseList(drugId) {
            log(`용량 리스트(doselist) 로드 중... [DrugID: ${drugId}]`);
            const displayDiv = document.getElementById('dose-list-display');
            displayDiv.innerHTML = '<div class="text-xs text-gray-500">데이터를 불러오는 중...</div>';

            try {
                const doseListRef = doc(db, "DrugMaster", drugId, "drugdose", "doselist");
                const docSnap = await getDoc(doseListRef);

                displayDiv.innerHTML = '';

                if (docSnap.exists() && docSnap.data().doses && docSnap.data().doses.length > 0) {
                    const doses = docSnap.data().doses;
                    doses.forEach((d, index) => {
                        displayDiv.innerHTML += `
                            <div class="p-3 border rounded bg-white text-xs text-gray-700 shadow-sm">
                                <div class="grid grid-cols-2 gap-1 mb-1">
                                    <div><span class="text-gray-400">Dose:</span> <strong>${d.Dose} ${d.DoseUnit}</strong></div>
                                    <div><span class="text-gray-400">InCaseOf:</span> <strong>${d.InCaseOf || '-'}</strong></div>
                                </div>
                                <div class="grid grid-cols-2 gap-1">
                                    <div><span class="text-gray-400">Age:</span> ${d.MinAge} ~ ${d.MaxAge}</div>
                                    <div><span class="text-gray-400">BWT:</span> ${d.MinBWT} ~ ${d.MaxBWT}</div>
                                </div>
                            </div>
                        `;
                    });
                    log(`용량 데이터 로드 완료 (${doses.length}건)`);
                } else {
                    displayDiv.innerHTML = '<div class="text-xs text-gray-500 text-center py-2">등록된 용량 정보가 없습니다.</div>';
                    log(`등록된 용량 정보 없음`);
                }
            } catch (error) {
                displayDiv.innerHTML = '<div class="text-xs text-red-500 text-center py-2">데이터 로드 실패</div>';
                log(`용량 리스트 로드 실패: ${error.message}`, 'error');
            }
        }

        /* =========================================
           3. 용량 데이터 배열(List) 추가 및 저장
        ========================================= */
        document.getElementById('btn-save-dose').addEventListener('click', async () => {
            if (!currentSelectedDrugId) return alert("먼저 검색 후 약품을 선택해주세요.");
            
            // 데이터 타입 엄격 준수 (double, int64, string)
            const newDose = {
                Dose: parseFloat(document.getElementById('input-Dose').value) || 0.0,
                DoseUnit: document.getElementById('input-DoseUnit').value || "",
                InCaseOf: document.getElementById('input-InCaseOf').value || "",
                MaxAge: parseInt(document.getElementById('input-MaxAge').value) || 0,
                MaxBWT: parseFloat(document.getElementById('input-MaxBWT').value) || 0.0,
                MinAge: parseInt(document.getElementById('input-MinAge').value) || 0,
                MinBWT: parseFloat(document.getElementById('input-MinBWT').value) || 0.0
            };

            const doseListRef = doc(db, "DrugMaster", currentSelectedDrugId, "drugdose", "doselist");

            try {
                log(`[${currentSelectedDrugId}] 용량 정보 추가 저장 중...`);
                
                // doses 필드(배열)에 새로운 객체를 추가 (문서가 없으면 생성됨)
                await setDoc(doseListRef, {
                    doses: arrayUnion(newDose),
                    last_updated: serverTimestamp(),
                    updated_by: auth.currentUser.email
                }, { merge: true });

                log(`성공: 용량 리스트가 안전하게 업데이트 되었습니다.`);
                
                // 입력 필드 초기화
                const inputs = document.querySelectorAll('#dose-detail-container input');
                inputs.forEach(input => input.value = '');

                // 리스트 다시 로드하여 갱신된 UI 표시
                await loadDoseList(currentSelectedDrugId);

            } catch (error) {
                log(`용량 저장 실패: ${error.message}`, 'error');
                console.error(error);
            }
        });

        // 기존 보안 설정용 함수 유지
        window.handleFireStore = async (mode, collectionName, docId) => {
            if (!auth.currentUser) return alert("로그인이 필요합니다.");
            const docRef = doc(db, collectionName, docId);
            log(`${mode === 'save' ? '저장' : '조회'} 요청 시작: ${collectionName}/${docId}...`);
            try {
                if (mode === 'save') {
                    await setDoc(docRef, { last_action: "Updated via Web Admin", author: auth.currentUser.email, timestamp: serverTimestamp() }, { merge: true });
                    log(`성공: ${collectionName} 데이터가 안전하게 저장되었습니다.`);
                } else {
                    const snap = await getDoc(docRef);
                    if (snap.exists()) log(`데이터 로드 성공: ${JSON.stringify(snap.data())}`);
                    else log(`결과: 해당 경로에 데이터가 존재하지 않습니다.`, 'warn');
                }
            } catch (error) {
                log(`[보안 거부] ${error.code}: 접근 권한이 없습니다.`, 'error');
            }
        };
    </script>
</body>
</html>
