<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBZZOOEgvGG1b7LR0HgS3DcS0N9v8dGXCc",
        authDomain: "doseby-585d7.firebaseapp.com",
        projectId: "doseby-585d7",
        storageBucket: "doseby-585d7.firebasestorage.app",
        messagingSenderId: "96877152271",
        appId: "1:96877152271:web:aa3af1ce766897db25fb7a",
        measurementId: "G-0LHJ4D0ERN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // UI 요소
    const loginSection = document.getElementById('login-section');
    const adminDashboard = document.getElementById('admin-dashboard');
    const consoleLog = document.getElementById('console-log');
    const userDisplay = document.getElementById('user-display');

    function log(msg, isError = false) {
        const time = new Date().toLocaleTimeString();
        const colorClass = isError ? 'text-red-400' : 'text-green-400';
        consoleLog.innerHTML += `<div class="${colorClass}">[${time}] ${msg}</div>`;
        consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    // 로그인 핸들러
    document.getElementById('btn-login').addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            alert(`로그인 실패: ${error.code}`);
        }
    });

    // 로그아웃 핸들러
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // 인증 상태 감시
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // 일단 로그인만 되면 대시보드를 보여줍니다.
            // 실제 권한은 데이터를 요청할 때 Firebase Security Rules가 판별합니다.
            loginSection.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
            userDisplay.innerText = `${user.displayName} (${user.email}) 접속 중`;
            log("사용자 로그인 확인됨. 관리자 권한은 작업 시 검증됩니다.");
        } else {
            loginSection.classList.remove('hidden');
            adminDashboard.classList.add('hidden');
        }
    });

    // Firestore 데이터 저장 함수
    window.saveData = async (collection, docId) => {
        try {
            const targetRef = doc(db, collection, docId);
            await setDoc(targetRef, { 
                lastUpdated: new Date().toISOString(),
                updatedBy: auth.currentUser.email
            }, { merge: true });
            log(`[성공] ${collection}/${docId} 저장 완료.`);
        } catch (e) {
            // 규칙 위반 시(예: 다른 이메일로 로그인 시) 이곳으로 빠집니다.
            log(`[권한 오류] 이메일 ${auth.currentUser.email}은(는) 이 영역에 쓰기 권한이 없습니다.`, true);
        }
    };

    // Firestore 데이터 읽기 함수
    window.readData = async (collection) => {
        log(`[조회 시도] ${collection}...`);
        try {
            const docSnap = await getDoc(doc(db, collection, 'test_doc'));
            if (docSnap.exists()) {
                log(`데이터 로드 성공: ${JSON.stringify(docSnap.data())}`);
            } else {
                log(`${collection}에 'test_doc' 문서가 없습니다.`);
            }
        } catch (e) {
            // 규칙 위반 시 이곳으로 빠집니다.
            log(`[권한 오류] 이 영역에 대한 읽기 권한이 없습니다.`, true);
        }
    };
</script>
